<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <!-- Light mode animated gradient -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="25%" stop-color="#666" />
      <stop offset="50%" stop-color="#111" />
      <stop offset="75%" stop-color="#666" />
      <stop offset="100%" stop-color="#111" />
      <animate attributeName="x1" values="0%;-200%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;0%" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    
    <!-- Dark mode animated gradient -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="25%" stop-color="#aaa" />
      <stop offset="50%" stop-color="#fff" />
      <stop offset="75%" stop-color="#aaa" />
      <stop offset="100%" stop-color="#fff" />
      <animate attributeName="x1" values="0%;-200%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;0%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Background glow -->
    <radialGradient id="glowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .bg-glow {
      fill: url(#glowLight);
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }

    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 64px;
      letter-spacing: 0.12em;
      text-anchor: middle;
      fill: url(#grad1);
    }
    
    .headline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.05em;
      fill: #555;
      text-anchor: middle;
    }
    
    .subtext {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 0.02em;
      fill: #777;
      text-anchor: middle;
    }
    
    .muted {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.04em;
      fill: #aaa;
      text-anchor: middle;
      text-transform: uppercase;
    }

    .fade-up-1 { opacity: 0; animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
    .fade-up-2 { opacity: 0; animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
    .fade-up-3 { opacity: 0; animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; }
    .fade-up-4 { opacity: 0; animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards; }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @media (prefers-color-scheme: dark) {
      .bg-glow { fill: url(#glowDark); }
      .name { fill: url(#grad2); }
      .headline { fill: #b0b0b0; }
      .subtext { fill: #888; }
      .muted { fill: #555; }
    }
  </style>

  <rect width="100%" height="100%" class="bg-glow" />

  <g class="fade-up-1">
    <text x="400" y="120" class="name">TALHA PASHA</text>
  </g>
  <g class="fade-up-2">
    <text x="400" y="175" class="headline">Software Engineer &amp; Builder</text>
  </g>
  <g class="fade-up-3">
    <text x="400" y="215" class="subtext">Turning ideas into practical software.</text>
  </g>
  <g class="fade-up-4">
    <text x="400" y="250" class="muted">Aspiring software engineer</text>
  </g>
</svg>
