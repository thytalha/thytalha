name: Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    # GitHub Actions does not allow 'secrets' in job-level 'if' conditions.
    # We check the repository owner to prevent this from failing on forks.
    if: github.repository_owner == 'thytalha'
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------ #
      # The 3D isometric contribution calendar (the one from the inspo)
      # ------------------------------------------------------------------ #
      - name: Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: "${{ github.repository_owner }}"
          filename: assets/metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          optimize: no
          use_prebuilt_image: yes

      # ------------------------------------------------------------------ #
      # Coding habits: commits per hour of day, per weekday, language activity
      # ------------------------------------------------------------------ #
      - name: Coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: "${{ github.repository_owner }}"
          filename: assets/metrics.habits.svg
          base: ""
          config_timezone: Asia/Karachi
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_charts: yes
          use_prebuilt_image: yes

      # ------------------------------------------------------------------ #
      # Language breakdown (bytes-weighted, recent-activity weighted)
      # ------------------------------------------------------------------ #
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: "${{ github.repository_owner }}"
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: Asia/Karachi
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_threshold: 0%
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          use_prebuilt_image: yes
